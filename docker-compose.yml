version: "3.8"

services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: keycloak-dev
    command: start-dev

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"

    ports:
      - "8081:8080"

    volumes:
      - keycloak_data:/opt/keycloak/data

    restart: unless-stopped

  django:
    build: .
    container_name: django-sso

    ports:
      - "8000:8000"

    environment:
      KEYCLOAK_PUBLIC_URL: "http://localhost:8081"
      KEYCLOAK_INTERNAL_URL: "http://host.docker.internal:8081"
      KEYCLOAK_REALM: "lab"
      KEYCLOAK_CLIENT_ID: "django-app"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET}"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - keycloak

    restart: unless-stopped


volumes:
  keycloak_data:
    name: keycloack_keycloak_data
